[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-routing-algorithm-simulation"
version = "0.1.0"
description = "CPU-only replay of cached LLM routing experiments"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "xgboost>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = [
  "catboost>=1.2,<2",
]

[project.scripts]
simulate-llm-routing = "llm_routing_simulation.run:main"
analyze-holdout-residuals = "llm_routing_simulation.residual_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
